<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>MIT Walking Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F6F7F8;
  --surface: #FFFFFF;
  --ink: #1C2127;
  --muted: #5B636C;
  --line: #DCE0E4;
  --cardinal: #A31F34;
  --cardinal-soft: #F7E6E9;
  --on-cardinal: #FFFFFF;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181C; --surface: #1F242A; --ink: #ECEFF2; --muted: #A3ACB5;
    --line: #333A42; --cardinal: #E0566B; --cardinal-soft: #3A1E24; --on-cardinal: #15181C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15181C; --surface: #1F242A; --ink: #ECEFF2; --muted: #A3ACB5;
  --line: #333A42; --cardinal: #E0566B; --cardinal-soft: #3A1E24; --on-cardinal: #15181C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "Atkinson Hyperlegible", -apple-system, "Helvetica Neue", Arial, sans-serif;
  font-size: 19px; line-height: 1.55;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
a { color: var(--cardinal); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--cardinal); outline-offset: 2px; }
.view { height: 100%; display: none; flex-direction: column; }
.view.active { display: flex; }

/* ---------- Menu ---------- */
#menu { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.menu-inner { max-width: 620px; margin: 0 auto; padding: 28px 22px 40px; width: 100%; }
.dome {
  display: block; width: 92px; height: auto; margin-bottom: 18px; color: var(--cardinal);
}
h1 { font-size: 2.3rem; line-height: 1.1; margin: 0 0 10px; letter-spacing: -0.01em; }
.lede { color: var(--muted); margin: 0 0 28px; font-size: 1.05rem; }
.start {
  display: flex; align-items: center; gap: 16px; width: 100%; text-align: left;
  background: var(--surface); border: 2px solid var(--line); border-radius: 18px;
  padding: 18px; margin-bottom: 14px; cursor: pointer;
}
.start:active { border-color: var(--cardinal); }
.start .pin {
  flex: 0 0 52px; height: 52px; border-radius: 50%; background: var(--cardinal); color: var(--on-cardinal);
  display: grid; place-items: center; font-weight: 700; font-size: 1.25rem;
}
.start strong { display: block; font-size: 1.2rem; line-height: 1.25; }
.start span.sub { color: var(--muted); font-size: 0.95rem; line-height: 1.35; display: block; margin-top: 2px; }
.resume {
  width: 100%; background: var(--cardinal); color: var(--on-cardinal); border: 0;
  border-radius: 14px; padding: 15px 18px; font-weight: 700; margin-bottom: 26px; cursor: pointer; display: none;
}
.resume.show { display: block; }
h2 { font-size: 1.3rem; margin: 34px 0 12px; }
.stop-list { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
.stop-list button {
  width: 100%; display: flex; gap: 14px; align-items: baseline; text-align: left;
  background: none; border: 0; border-bottom: 1px solid var(--line); padding: 13px 2px; cursor: pointer;
}
.stop-list .n { color: var(--cardinal); font-weight: 700; min-width: 1.8em; }
.stop-list .t { font-size: 1.02rem; }
.map-fig { margin: 0; }
.map-fig img { width: 100%; max-width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); display: block; }
.map-fig figcaption { color: var(--muted); font-size: 0.9rem; margin-top: 8px; }

/* ---------- Tour ---------- */
.topbar {
  flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--bg);
}
.topbar button {
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  padding: 7px 15px; font-size: 0.95rem; font-weight: 700; cursor: pointer;
}
.route-name { color: var(--muted); font-size: 0.92rem; text-align: right; line-height: 1.25; }
.track {
  flex: 1 1 auto; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
  scrollbar-width: none; overscroll-behavior-x: contain;
}
.track::-webkit-scrollbar { display: none; }
.page {
  flex: 0 0 100%; width: 100%; height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch;
  scroll-snap-align: start; scroll-snap-stop: always; overscroll-behavior-y: contain;
}
.page-inner { max-width: 620px; margin: 0 auto; padding: 22px 22px 48px; }
.num {
  font-size: 5.5rem; line-height: 0.9; font-weight: 700; color: var(--cardinal);
  letter-spacing: -0.04em; margin: 4px 0 6px;
}
.num small { font-size: 1.05rem; letter-spacing: 0; color: var(--muted); font-weight: 400; margin-left: 6px; }
.page h2 { font-size: 1.75rem; line-height: 1.2; margin: 0 0 4px; }
.bldg { color: var(--muted); margin: 0 0 20px; font-size: 1rem; }
.directions {
  background: var(--cardinal-soft); border-radius: 14px; padding: 14px 16px; margin: 0 0 24px;
  display: flex; gap: 12px; align-items: flex-start;
}
.directions svg { flex: 0 0 22px; margin-top: 3px; color: var(--cardinal); }
.directions p { margin: 0; }
.facts { padding-left: 1.15em; margin: 0 0 20px; }
.facts li { margin-bottom: 12px; padding-left: 4px; }
.facts li::marker { color: var(--cardinal); }
.facts em { font-style: italic; }
.links { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; margin-bottom: 4px; }
.links .more { color: var(--muted); font-size: 0.85rem; margin-bottom: -4px; }
.links a {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 13px 16px; text-decoration: none; color: var(--ink); font-weight: 700; font-size: 1rem;
}
.links a span.src { color: var(--muted); font-weight: 400; font-size: 0.88rem; }
.page .map-fig { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); }
.subhead { font-size: 1.1rem; margin: 22px 0 8px; }
.finish {
  margin-top: 28px; width: 100%; background: var(--cardinal); color: var(--on-cardinal);
  border: 0; border-radius: 14px; padding: 15px; font-weight: 700; cursor: pointer;
}

.bottombar {
  flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 10px 16px 12px;
  border-top: 1px solid var(--line); background: var(--bg);
}
.bottombar button {
  flex: 0 0 auto; width: 54px; height: 48px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; cursor: pointer;
}
.bottombar button:disabled { opacity: 0.35; }
.progress { flex: 1 1 auto; min-width: 0; text-align: center; }
.progress .label { font-size: 0.92rem; color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 5px; }
.bar i { display: block; height: 100%; background: var(--cardinal); width: 0; transition: width .25s ease; }
.hint { color: var(--muted); font-size: 0.9rem; text-align: center; margin: 4px 0 0; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>

let route = 'k', current = 0;

function save() {
  try { localStorage.setItem('mitTour', JSON.stringify({ route, current })); } catch (e) {}
}
function load() {
  try { return JSON.parse(localStorage.getItem('mitTour') || 'null'); } catch (e) { return null; }
}

const pinSvg = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';

function renderTour() {
  const order = ROUTES[route].order;
  $('routeName').textContent = ROUTES[route].name;
  track.innerHTML = order.map((si, pos) => {
    const s = STOPS[si];
    const lead = s.factsLead ? `<p class="subhead"><strong>${s.facts[0]}</strong></p>` : '';
    const off = s.factsLead ? 1 : 0;
    const linkHtml = l => `<a href="${l.url}" target="_blank" rel="noopener"><span>${l.label}</span><span class="src">${l.src}</span></a>`;
    const list = s.facts.slice(off).map((f, j) => {
      const ls = (s.links || []).filter(l => l.after === j + off);
      return `<li>${f}${ls.length ? `<div class="links"><span class="more">Click to learn more</span>${ls.map(linkHtml).join('')}</div>` : ''}</li>`;
    }).join('');
    const links = '';
    const map = `<figure class="map-fig"><img src="${MAP_SRC}" alt="Map of central MIT campus with numbered buildings"><figcaption>Campus map. Building 32 (Stata) is at the top, Building 66 is the triangle to its right, and Building 10 sits under the Great Dome.</figcaption></figure>`;
    const last = pos === order.length - 1 ? `<button class="finish" type="button" data-menu>Back to menu</button>` : '';
    return `<article class="page" aria-label="Stop ${pos + 1} of ${order.length}">
      <div class="page-inner">
        <div class="num">${pos + 1}<small>of ${order.length}</small></div>
        <h2>${s.title}</h2>
        <p class="bldg">${s.bldg}</p>
        <div class="directions">${pinSvg}<p>${s[route]}</p></div>
        ${lead}<ul class="facts">${list}</ul>
        ${links}${map}${last}
        ${pos === 0 ? '<p class="hint">Swipe left for the next stop</p>' : ''}
      </div></article>`;
  }).join('');
  track.querySelectorAll('[data-menu]').forEach(b => b.addEventListener('click', showMenu));
}

function updateBar() {
  const n = ROUTES[route].order.length;
  $('progLabel').textContent = `Stop ${current + 1} of ${n}`;
  $('progBar').style.width = ((current + 1) / n * 100) + '%';
  $('prevBtn').disabled = current === 0;
  $('nextBtn').disabled = current === n - 1;
}

function goTo(i, smooth) {
  const n = ROUTES[route].order.length;
  current = Math.max(0, Math.min(n - 1, i));
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  track.scrollTo({ left: current * track.clientWidth, behavior: smooth && !reduce ? 'smooth' : 'auto' });
  updateBar(); save();
}

function startTour(r, pos) {
  route = r;
  renderTour();
  $('menu').classList.remove('active');
  $('tour').classList.add('active');
  requestAnimationFrame(() => {
    goTo(pos || 0, false);
    track.querySelectorAll('.page').forEach(p => p.scrollTop = 0);
  });
}

function showMenu() {
  $('tour').classList.remove('active');
  $('menu').classList.add('active');
  refreshResume();
}

function refreshResume() {
  const s = load(), btn = $('resumeBtn');
  if (s && ROUTES[s.route] && s.current > 0) {
    const stop = STOPS[ROUTES[s.route].order[s.current]];
    btn.textContent = `Continue: stop ${s.current + 1}, ${stop.title}`;
    btn.classList.add('show');
    btn.onclick = () => startTour(s.route, s.current);
  } else btn.classList.remove('show');
}

let ticking = false;
track.addEventListener('scroll', () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    const i = Math.round(track.scrollLeft / track.clientWidth);
    if (i !== current) { current = i; updateBar(); save(); }
    ticking = false;
  });
}, { passive: true });

window.addEventListener('resize', () => {
  if ($('tour').classList.contains('active')) track.scrollLeft = current * track.clientWidth;
});

$('prevBtn').addEventListener('click', () => goTo(current - 1, true));
$('nextBtn').addEventListener('click', () => goTo(current + 1, true));
$('menuBtn').addEventListener('click', showMenu);
document.addEventListener('keydown', e => {
  if (!$('tour').classList.contains('active')) return;
  if (e.key === 'ArrowRight') goTo(current + 1, true);
  if (e.key === 'ArrowLeft') goTo(current - 1, true);
});
document.querySelectorAll('.start').forEach(b => b.addEventListener('click', () => startTour(b.dataset.route, 0)));

$('stopList').innerHTML = STOPS.map((s, i) =>
  `<li><button type="button" data-i="${i}"><span class="n">${i + 1}</span><span class="t">${s.title}</span></button></li>`).join('');
$('stopList').addEventListener('click', e => {
  const b = e.target.closest('button'); if (b) startTour('k', +b.dataset.i);
});
refreshResume();
</script>
</body>
</html>
